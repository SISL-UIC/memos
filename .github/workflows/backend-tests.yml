name: Backend Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: 1.26.2
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
jobs:
  static-checks:
    name: Static Checks
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: Verify go.mod is tidy
      run: |
        go mod tidy -go=${{ env.GO_VERSION }}
        git diff --exit-code
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        args: --timeout=3m
    timeout-minutes: 6
  tests:
    name: Tests (${{ matrix.test-group }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
        - test-group: store
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: Run tests
      run: |
        case "${{ matrix.test-group }}" in
          store)
            # Run store tests for all drivers (sqlite, mysql, postgres)
            go test -v -coverprofile=coverage.out -covermode=atomic ./store/...
            ;;
          server)
            # Includes ./server/test, which boots the real server via
            # server.NewServer and smokes every router it mounts.
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./server/...
            ;;
          internal)
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...
            ;;
          other)
            go test -v -race -coverprofile=coverage.out -covermode=atomic \
              ./cmd/... ./internal/... ./proto/...
            ;;
        esac
      env:
        DRIVER: ${{ matrix.test-group == 'store' && '' || 'sqlite' }}
    - name: Upload coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: ${{ matrix.test-group }}
        fail_ci_if_error: false
    timeout-minutes: 6
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    paths:
    - go.mod
    - go.sum
    - '**.go'
